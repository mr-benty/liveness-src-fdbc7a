name: expired
on:
  workflow_dispatch:
    inputs:
      oob:
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: expired-artifact-arm
        env:
          OOB: ${{ github.event.inputs.oob }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$TOKEN"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          EXP=10387063794
          echo "===== CONTROL: artifact_url ONLY (expect 400 Invalid artifact url) ====="
          curl -s -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"artifact_url\":\"https://$OOB/_apis/pipelines/1/runs/1/artifacts?arm=ctl\",\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          sleep 5
          echo "===== TEST: EXPIRED artifact_id $EXP + arbitrary artifact_url ====="
          curl -s -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"artifact_id\":$EXP,\"artifact_url\":\"https://$OOB/_apis/pipelines/1/runs/1/artifacts?arm=EXPIRED\",\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          echo "===== waiting for deployer ====="
          for i in 1 2 3 4 5 6; do sleep 15; curl -s "$API/../deployment/status/$GITHUB_SHA" -H "Authorization: token $GH_TOKEN" 2>/dev/null | head -c 200; echo " <- t=$((i*15))s"; done
